# Theme & UI Configuration
[project.theme]
custom_dir = "overrides"
logo = "images/logo.svg"
favicon = "images/logo.svg"
font = { text = false, code = false }
features = [
    "search.highlight",
    "navigation.tabs",
    "navigation.expand",
    "content.code.copy",
    "content.code.annotate",
    "header.autohide",
    "content.footnote.tooltips",
    "content.action.view"  # View source of this page
]

[[project.theme.palette]]
scheme = "slate"
primary = "black"
accent = "amber"
toggle = { icon = "material/brightness-4", name = "Switch to light mode" }

[[project.theme.palette]]
scheme = "default"
primary = "white"
accent = "amber"
toggle = { icon = "material/brightness-7", name = "Switch to dark mode" }
# Note: Zensical manages palettes, default search engines, and modern light/dark toggle
# workflows natively without requiring explicit readthedocs theme overrides.

# Markdown Extension Implementations
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.footnotes]

[project.markdown_extensions.pymdownx.blocks.caption]
[project.markdown_extensions.md_in_html]


[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.highlight]
use_pygments = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
# Code Documentation Integration (mkdocstrings compatibility)
[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
options = { show_source = true, show_root_heading = true }

[[project.markdown_extensions.zensical.extensions.preview.configurations]]
targets.include = [
    "concepts/*",
]

[project.extra.status]
in_progress = "In Progress"
in_research = "In Progress"
needs_verification = "Needs Verification"
needs_revision = "Needs Revision"
completed = "Completed"
delayed = "Delayed"
undetermined = "Undetermined"